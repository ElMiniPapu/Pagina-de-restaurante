<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Chef - Il Ducale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Encabezado Desktop y Móvil para el Chef -->
    <header class="navbar">
        <!-- Ícono hamburguesa para pantallas chicas -->
        <button class="hamburger-btn" id="openMenuBtn" aria-label="Abrir menú">&#9776;</button>

        <!-- Enlaces directos para la pantalla de escritorio -->
        <nav class="nav-links">
            <a href="/pedidos">Pedidos</a>
            <span class="divider">|</span>
            <a href="/menu_chef" class="active">Menu</a>
            <span class="divider">|</span>
            <a href="/perfil">Perfil</a>
            <span class="divider">|</span>
            <a href="/logout" class="btn-logout">Cerrar sesión</a>
        </nav>

        <h1 class="mobile-title">MENU CHEF</h1>

        <div class="logo-header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Il Ducale Logo">
        </div>
    </header>

    <!-- Menú Desplegable Lateral para Móvil -->
    <div class="mobile-drawer" id="mobileDrawer">
        <h2 class="user-name">{{ session.get('usuario', 'CHEF') | upper }}</h2>

        <nav class="drawer-links">
            <a href="/pedidos" class="drawer-btn">Pedidos</a>
            <a href="/menu_chef" class="drawer-btn">Menu</a>
            <a href="/perfil" class="drawer-btn">Perfil</a>
            <a href="/logout" class="drawer-btn logout-drawer-btn">Cerrar sesión</a>
        </nav>

        <button class="close-drawer-btn" id="closeMenuBtn" aria-label="Cerrar menú">
            <span class="arrow-back-icon">&#10140;</span>
        </button>
    </div>

    <!-- Selección de Categorías -->
    <main class="menu-container">
        <div class="menu-card-wrapper">
            <div class="menu-grid">
                <a href="/categoria_chef/comidas" class="category-card">
                    <img src="{{ url_for('static', filename='btn_comidas.png') }}" alt="Comidas">
                </a>
                <a href="/categoria_chef/postres" class="category-card">
                    <img src="{{ url_for('static', filename='btn_postres.png') }}" alt="Postres">
                </a>
                <a href="/categoria_chef/bebidas" class="category-card">
                    <img src="{{ url_for('static', filename='btn_bebidas.png') }}" alt="Bebidas">
                </a>
            </div>
        </div>
    </main>

    <script>
        const openBtn = document.getElementById('openMenuBtn');
        const closeBtn = document.getElementById('closeMenuBtn');
        const drawer = document.getElementById('mobileDrawer');

        if(openBtn && closeBtn && drawer) {
            openBtn.addEventListener('click', () => drawer.classList.add('active'));
            closeBtn.addEventListener('click', () => drawer.classList.remove('active'));
        }
    </script>

</body>
</html>
