<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Il Ducale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Botón para volver atrás -->
    <a href="/" class="btn-back">
        <span class="arrow-icon">&#10140;</span>
    </a>

    <!-- Logo en la esquina superior derecha -->
    <div class="logo-container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Il Ducale Logo">
    </div>

    <!-- 1. AGREGAR ESTE CONTENEDOR PARA CENTRAR -->
    <div class="centered-page">
        
        <div class="main-card form-card">
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                  {% for message in messages %}
                    <p class="error-msg">{{ message }}</p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="form-container">
                <div class="input-group">
                    <label for="email">Mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-solid btn-submit">INICIAR SESIÓN</button>
            </form>
        </div>

    </div> <!-- FIN DEL CONTENEDOR CENTERED-PAGE -->

</body>
</html>
